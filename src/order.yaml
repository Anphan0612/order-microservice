openapi: 3.0.3
info:
  title: FastfoodDelivery - Order API
  version: 1.0.0
paths:
  /api/v1/orders:
    post:
      summary: Create a new order
      operationId: createOrder
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '409': { description: Idempotency key conflict }
        '422': { description: Out of stock or price changed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrderRequest:
      type: object
      required: [items, deliveryAddress, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              quantity: { type: integer, minimum: 1 }
        deliveryAddress:
          type: object
          required: [fullName, phone, line1, ward, district, city]
          properties:
            fullName: { type: string }
            phone: { type: string }
            line1: { type: string }
            ward: { type: string }
            district: { type: string }
            city: { type: string }
        note: { type: string }
        paymentMethod: { type: string, enum: [COD, VNPAY, MOMO] }
        couponCode: { type: string }
    OrderItem:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        unitPrice: { type: integer, format: int64 }
        quantity: { type: integer }
        lineTotal: { type: integer, format: int64 }
    OrderResponse:
      type: object
      required: [orderId, status, items, subtotal, grandTotal, currency, createdAt]
      properties:
        orderId: { type: string, example: ORD-20250923-000123 }
        status: { type: string, enum: [PENDING, CONFIRMED, SHIPPING, DELIVERED, CANCELLED] }
        currency: { type: string, example: VND }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        shippingFee: { type: integer, format: int64 }
        grandTotal: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
